# Configuration ruff commune (backend + scripts)
line-length = 120
target-version = "py311"
extend-exclude = ["backend/artefacts", "frontend", ".venv", "model"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF"]
ignore = [
  "S101",   # assert autorisé dans les tests
  "RUF001", "RUF002", "RUF003",  # caractères typographiques français (é, ’, …)
  "E702",
  "N818",   # exceptions nommées en français (FichierRefuse…)
]

[lint.per-file-ignores]
"**/tests/**" = ["S", "N802"]
"scripts/**" = ["S311", "E501"]

