[project]
name = "freshrotten-guard"
version = "1.0.0"
description = "API FreshRotten Guard : fruit frais ou pourri, avec défenses de sécurité de l'IA"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "securite: scénario de la suite de sécurité (repris dans le rapport)",
  "lent: test long (attaques, robustesse)",
  "dataset: nécessite le dataset local (FRG_DATASET)",
]
filterwarnings = ["ignore::DeprecationWarning"]
